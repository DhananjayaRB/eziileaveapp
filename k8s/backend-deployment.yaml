---
apiVersion: v1
kind: Service
metadata:
  namespace: qa # Replace with your namespace
  name: resolve-api-leave # Use the same name as the deployment
  labels:
    app: resolve-api-leave # Consistent label
spec:
  ports:
    - name: http # Give a meaningful name to the port
      port: 4000 # Match your container port
      targetPort: 4000 # Match your container port
      protocol: TCP
  selector:
    app: resolve-api-leave # Consistent label
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: resolve-api-leave # Consistent label
  name: resolve-api-leave # Use the same name as the service
  namespace: qa # Replace with your namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resolve-api-leave # Consistent label
  strategy:
    rollingUpdate: # Use RollingUpdate for better deployments
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: resolve-api-leave # Consistent label
      name: resolve-api-leave
    spec:
      nodeSelector: # Add nodeSelector if needed
        env: nonprod # Example
      dnsConfig: # Add dnsConfig if needed
        searches:
          - svc.cluster.local
        options:
          - name: ndots
            value: '2'
      containers:
      - name: resolve-api-leave # Give a meaningful name to the container
        image: resolvepay.azurecr.io/qa/resolve-api-leave:{{BUILDTAG}} # Replace with your image and tag
        imagePullPolicy: IfNotPresent # Good practice
        ports:
          - containerPort: 4000 # Match your container port
            protocol: TCP
        env:
          - name: DATABASE_URL
            value: postgresql://user:password@db:5432/resolve-leave # Keep your environment variables