---
apiVersion: v1
kind: Service
metadata:
  namespace: {{Environment}} # Replace with your namespace
  name: backend # Use the same name as the deployment
  labels:
    app: backend # Consistent label
spec:
  ports:
    - name: http # Give a meaningful name to the port
      port: 4000 # Match your container port
      targetPort: 4000 # Match your container port
      protocol: TCP
  selector:
    app: backend # Consistent label
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend # Consistent label
  name: backend # Use the same name as the service
  namespace: {{Environment}} # Replace with your namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend # Consistent label
  strategy:
    rollingUpdate: # Use RollingUpdate for better deployments
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend # Consistent label
      name: backend
    spec:
      nodeSelector: # Add nodeSelector if needed
        env: nonprod # Example
      dnsConfig: # Add dnsConfig if needed
        searches:
          - svc.cluster.local
        options:
          - name: ndots
            value: '2'
      containers:
      - name: backend # Give a meaningful name to the container
        image: resolvepay.azurecr.io/{{Environment}}/backend:{{BUILDTAG}} # Replace with your image and tag
        imagePullPolicy: IfNotPresent # Good practice
        ports:
          - containerPort: 4000 # Match your container port
            protocol: TCP
        env:
          - name: DATABASE_URL
            value: postgresql://user:password@db:5432/resolve-leave # Keep your environment variables
        volumeMounts: # Handle your volumes
          - mountPath: /app/node_modules
            name: backend-claim0
      restartPolicy: Always # Keep your restart policy
      volumes:
        - name: backend-claim0
          persistentVolumeClaim:
            claimName: backend-claim0