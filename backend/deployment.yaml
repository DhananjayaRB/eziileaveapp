---
apiVersion: v1
kind: Service
metadata:
  namespace: {{Environment}}
  name: db
  labels:
    app: db
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: db
  type: ClusterIP # Or LoadBalancer if you need external access to the DB (not recommended for production)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{Environment}}
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:latest
        ports:
        - containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: user
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: resolve-leave
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pgdata-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{Environment}}
  name: pgdata-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  namespace: {{Environment}}
  name: resolvepay-nodejs-app
  labels:
    app: resolvepay-nodejs-app
spec:
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
  selector:
    app: resolvepay-nodejs-app
  type: LoadBalancer # Or ClusterIP if internal access only

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{Environment}}
  name: resolvepay-nodejs-app
  labels:
    app: resolvepay-nodejs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resolvepay-nodejs-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: resolvepay-nodejs-app
    spec:
      containers:
      - name: resolvepay-nodejs-app
        image: resolvepay.azurecr.io/{{Environment}}/resolvepay-nodejs-app:{{BUILDTAG}}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: postgresql://user:password@db:5432/resolve-leave # Use the service name
        resources: # Add resource requests/limits!
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      imagePullSecrets:
      - name: resolvebizpullsecret