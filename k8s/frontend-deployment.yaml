---
apiVersion: v1
kind: Service
metadata:
  namespace: {{Environment}} # Replace with your namespace
  name: frontend
  labels:
    app: frontend
spec:
  ports:
    - name: http # Descriptive port name
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
  namespace: {{Environment}} # Replace with your namespace
spec:
  replicas: 2 # Use the replica count from the second definition
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate: # Use RollingUpdate for better deployments
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend # Use a consistent and meaningful name
        image: resolvepay.azurecr.io/{{Environment}}/frontend:latest # Use the ACR image
        imagePullPolicy: IfNotPresent # Good practice
        ports:
          - containerPort: 3000
            protocol: TCP
      restartPolicy: Always