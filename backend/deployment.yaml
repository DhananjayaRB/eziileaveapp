apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolvepay-nodejs-app
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resolvepay-nodejs-app
  template:
    metadata:
      labels:
        app: resolvepay-nodejs-app
    spec:
      containers:
      - name: app
        image: resolvepay.azurecr.io/qa/resolvepay-nodejs-app:{{BUILDTAG}}
        imagePullPolicy: IfNotPresent