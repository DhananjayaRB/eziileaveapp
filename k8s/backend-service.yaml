apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: myACR.azurecr.io/backend:latest  # Use ACR image
        ports:
        - containerPort: 4000
        env:
        - name: DATABASE_HOST
          value: "database"
