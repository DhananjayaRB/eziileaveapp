# db.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: qa
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: user
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: resolve-leave
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pgdata-pvc # See below for PVC definition

---
# db-service.yaml
apiVersion: v1
kind: Service
metadata:
 namespace: qa
  name: db
spec:
  selector:
    app: db
  ports:
  - protocol: TCP
    port: 5432 # The port exposed externally
    targetPort: 5432 # The port the container listens on
  type: ClusterIP # Exposes the service on an internal IP in the cluster

---
# pgdata-pvc.yaml  (Persistent Volume Claim)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-pvc
spec:
  accessModes:
    - ReadWriteOnce # Or ReadWriteMany if needed, but be careful with Postgres!
  resources:
    requests:
      storage: 1Gi # Adjust as needed

---
# backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: qa
  name: resolvepay-nodejs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resolvepay-nodejs-app
  template:
    metadata:
      labels:
        app: resolvepay-nodejs-app
    spec:
      containers:
      - name: resolvepay-nodejs-app
        image: resolvepay.azurecr.io/qa/resolvepay-nodejs-app:{{BUILDTAG}} # Replace with your actual image name!
        ports:
        - containerPort: 4000
        env:
        - name: DATABASE_URL
          value: postgresql://user:password@db:5432/resolve-leave # Use the service name 'db'
        volumeMounts: # If you still need the volume mounts (generally not needed in Kubernetes)
          - mountPath: /app
            name: app-volume
        resources: # Resource limits and requests (important for Kubernetes)
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes: # Define the volumes (if needed)
        - name: app-volume
          emptyDir: {} # Or use a persistent volume if you need persistence
      imagePullSecrets: # If your image is in a private registry
      - name: resolvebizpullsecret
---
# backend-service.yaml
apiVersion: v1
kind: Service
metadata:
  namespace: qa
  name: backend
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 4000 # The port exposed externally
    targetPort: 4000 # The port the container listens on
  type: LoadBalancer # Use LoadBalancer to expose externally (or NodePort if needed)